name: Binance Screener

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify files
        run: |
          echo "Repository:"
          pwd
          echo
          echo "Files:"
          find . -maxdepth 3 -type f | sort
          echo
          echo "Python:"
          python --version

      - name: Run Binance Screener
        env:
          # ------------------------------------------------------------
          # BINANCE
          # ------------------------------------------------------------
          BINANCE_BASE_URL: "https://data-api.binance.vision"

          # ------------------------------------------------------------
          # UNIVERSE
          # ------------------------------------------------------------
          # Quotes autorisés, séparés par des virgules.
          QUOTE_ASSETS: "USDT"

          # Exclusions configurables.
          EXCLUDE_STABLECOINS: "true"
          EXCLUDE_LEVERAGED_TOKENS: "true"

          # ------------------------------------------------------------
          # CRITERES DE SELECTION
          # ------------------------------------------------------------
          MIN_24H_QUOTE_VOLUME: "5000000"
          MIN_24H_TRADES: "1000"

          # Valeurs volontairement larges au départ.
          # Elles permettent de ne pas imposer artificiellement
          # une direction au marché.
          MIN_24H_CHANGE_PERCENT: "-100"
          MAX_24H_CHANGE_PERCENT: "100"

          # Spread maximum en %.
          MAX_SPREAD_PERCENT: "0.50"

          # Prix minimum.
          MIN_PRICE: "0.00000001"

          # ------------------------------------------------------------
          # ANALYSE TECHNIQUE
          # ------------------------------------------------------------
          TECHNICAL_ENABLED: "true"

          # Timeframe.
          TECHNICAL_INTERVAL: "1h"

          # Nombre de bougies historiques.
          TECHNICAL_KLINES_LIMIT: "250"

          # Indicateurs activables individuellement.
          ENABLE_EMA: "true"
          ENABLE_RSI: "true"
          ENABLE_MACD: "true"
          ENABLE_ATR: "true"
          ENABLE_VOLUME_RATIO: "true"

          # Périodes.
          EMA_FAST_PERIOD: "20"
          EMA_SLOW_PERIOD: "50"

          RSI_PERIOD: "14"

          MACD_FAST_PERIOD: "12"
          MACD_SLOW_PERIOD: "26"
          MACD_SIGNAL_PERIOD: "9"

          ATR_PERIOD: "14"
          VOLUME_MA_PERIOD: "20"

          # Nombre maximum d'actifs auxquels appliquer
          # l'analyse technique.
          #
          # 0 = tous les survivants.
          #
          # Pour commencer, 300 est plus prudent vis-à-vis
          # du temps d'exécution et des limites API.
          TECHNICAL_MAX_ASSETS: "300"

          # Nombre de requêtes techniques simultanées.
          TECHNICAL_WORKERS: "8"

          # ------------------------------------------------------------
          # API
          # ------------------------------------------------------------
          HTTP_TIMEOUT_SECONDS: "20"
          HTTP_RETRIES: "3"

          # ------------------------------------------------------------
          # EMAIL
          # ------------------------------------------------------------
          EMAIL_HOST: "smtp.gmail.com"
          EMAIL_PORT: "465"

          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          EMAIL_TOP_RESULTS: "50"

        run: |
          python -u screener.py
