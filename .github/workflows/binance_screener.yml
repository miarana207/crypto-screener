name: Binance Automated Screener

on:
  schedule:
    # Exécution automatique toutes les heures (ajustez selon vos besoins)
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run screener script
        env:
          PYTHONUNBUFFERED: "1"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -u screener.py
